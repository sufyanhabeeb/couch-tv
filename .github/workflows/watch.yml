# The Apple Watch app (watch/, docs/WATCH.md), built on GitHub's macOS runners, so no Mac is needed.
# Every push: a simulator build, which needs no Apple account. Run by hand with "testflight" ticked:
# signed with your App Store Connect API key and uploaded to TestFlight. That needs
#   secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text)
#   variables: APPLE_TEAM_ID, WATCH_BUNDLE_ID, BRIDGE_URL (for example http://192.168.1.20:5400)
name: watch app

on:
  push:
    paths:
      - "watch/**"
      - ".github/workflows/watch.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch || true

      - name: Generate the Xcode project
        working-directory: watch
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the watch simulator (no Apple account needed)
        working-directory: watch
        run: |
          set -o pipefail
          xcodebuild build -project CouchRemote.xcodeproj -scheme CouchRemote \
            -destination 'generic/platform=watchOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Archive, sign and upload to TestFlight
        if: ${{ inputs.testflight }}
        working-directory: watch
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.WATCH_BUNDLE_ID }}
          BRIDGE_URL: ${{ vars.BRIDGE_URL }}
        run: |
          set -o pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID BUNDLE_ID; do
            [ -n "${!v}" ] || { echo "missing $v (see the top of this file)"; exit 1; }
          done
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project CouchRemote.xcodeproj -scheme CouchRemote \
            -destination 'generic/platform=watchOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/CouchRemote.xcarchive" "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" COUCH_BUNDLE_ID="$BUNDLE_ID" COUCH_BRIDGE_URL="$BRIDGE_URL" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CouchRemote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | tail -40
          rm -f "$KEY"
