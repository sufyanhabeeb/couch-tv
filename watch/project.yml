# The Apple Watch app (docs/WATCH.md, "The watch app"). XcodeGen turns this into the Xcode project:
#   brew install xcodegen && cd watch && xcodegen generate
# The bundle id, team and bridge address come from build settings, so nothing personal lives here:
#   xcodebuild ... COUCH_BUNDLE_ID=com.you.couchtv.watch DEVELOPMENT_TEAM=ABCDE12345 COUCH_BRIDGE_URL=http://192.168.1.20:5400
name: CouchRemote
options:
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    COUCH_BUNDLE_ID: dev.couchtv.watch
    COUCH_BRIDGE_URL: ""
targets:
  CouchRemote:
    type: application
    platform: watchOS
    sources:
      - CouchRemote
    scheme: {}
    info:
      path: CouchRemote/Info.plist
      properties:
        CFBundleDisplayName: Couch TV
        WKApplication: true
        WKWatchOnly: true
        CouchBridgeURL: $(COUCH_BRIDGE_URL)
        NSLocalNetworkUsageDescription: Couch TV talks to the couch-tv bridge on your home network to control the TV.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COUCH_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
